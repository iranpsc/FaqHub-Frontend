# Local Next.js dev server.
#
# The browser calls the Laravel nginx port on the host.
# Server-side fetches use host.docker.internal so they reach that same port
# from inside this container.
#
#   docker compose -f docker-compose.dev.yml up -d --build

name: faqhub-frontend-dev

services:
  web:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    image: faqhub-frontend-dev:latest
    container_name: faqhub-frontend-dev
    working_dir: /app
    command: sh -c "if [ ! -x node_modules/.bin/next ]; then npm ci; fi && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      SERVER_API_URL: ${SERVER_API_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    restart: unless-stopped

volumes:
  web_node_modules:
  web_next:
