services:
  faq-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "20"
    image: faq-frontend:latest
    container_name: faq-frontend
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: production
      PORT: "3005"
      HOSTNAME: "0.0.0.0"
      # Runtime fallback for server-side code (client bundle already baked at build)
      # If NEXT_PUBLIC_API_URL is set in .env.production it is used, otherwise fallback to http://localhost:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    # Do not bind to host network; publish only the app port
    # Use `docker compose up --build -d` to build and run
